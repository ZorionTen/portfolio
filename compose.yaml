name: portfolio-dev

services:
  frontend:
    image: node:24-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_AI_API_URL: http://localhost:8000
      VITE_BACKEND_API_URL: http://localhost:8080
    volumes:
      - ./portfolio-frontend:/workspace
      - frontend-node-modules:/workspace/node_modules
    ports:
      - "5176:5173"
    init: true

  backend:
    image: maven:3.9.11-eclipse-temurin-17-alpine
    working_dir: /workspace
    command: ./mvnw spring-boot:run
    env_file:
      - ./portfolio-backend/.env
    volumes:
      - ./portfolio-backend:/workspace
      - maven-cache:/root/.m2
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    init: true

  ai:
    image: python:3.12-slim
    working_dir: /workspace
    command: sh -c "pip install --disable-pip-version-check --requirement requirements-dev.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - ./portfolio-ai/.env
    environment:
      SKILLS_FILE: /knowledge/JOB_APPLICATION_MASTER.md
      GITHUB_KNOWLEDGE_URL: http://backend:8080/api/github/knowledge
    volumes:
      - ./portfolio-ai:/workspace
      - ./JOB_APPLICATION_MASTER.md:/knowledge/JOB_APPLICATION_MASTER.md:ro
      - pip-cache:/root/.cache/pip
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    init: true

volumes:
  frontend-node-modules:
  maven-cache:
  pip-cache:
